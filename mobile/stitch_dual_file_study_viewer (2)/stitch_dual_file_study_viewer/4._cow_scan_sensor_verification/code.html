<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GauRakshak - Cow Identification & Sensor Pair</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecf7ea',
              100: '#d7eed4',
              500: '#235d3a',
              700: '#1a472c',
              800: '#143823',
            },
            surface: '#f6faf4',
            card: '#ffffff',
            ink: '#19211c',
            subtle: '#5c6b61',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background-color: #0f2015;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-white p-5 max-w-md mx-auto relative overflow-hidden">

  <!-- Scanner Header -->
  <div class="flex items-center justify-between py-2 z-20">
    <button class="w-10 h-10 rounded-xl bg-black/40 backdrop-blur border border-white/10 flex items-center justify-center text-white">
      <span class="material-symbols-outlined text-xl">close</span>
    </button>
    <div class="text-center">
      <div class="text-xs uppercase tracking-wider text-emerald-300 font-bold">Step 1: Cow Identification</div>
      <div class="text-sm font-extrabold text-white">Scan RFID / Ear-Tag</div>
    </div>
    <button class="w-10 h-10 rounded-xl bg-black/40 backdrop-blur border border-white/10 flex items-center justify-center text-emerald-300">
      <span class="material-symbols-outlined text-xl">flashlight_on</span>
    </button>
  </div>

  <!-- Camera Viewport / RFID Scanning Frame Simulation -->
  <div class="relative w-full aspect-[4/4.8] my-auto rounded-3xl overflow-hidden border-2 border-emerald-500/40 shadow-2xl flex flex-col items-center justify-center bg-black/60">
    
    <!-- Background Pasture & Cow Preview as Target -->
    <img src="https://lh3.googleusercontent.com/aida/AEtjO1Ux3LiujZhdkfXkn7QCGZs9XnvWmgA1SMjiqvmASnPUF4urvUNHjLQdzPEi1Sr1clCW0z62_bJwsb3EPolAm2W1p6c3xIc-R1SfquYf4EO5ykwUW0U-6CKIGbmZnTUY4zeIZ0LG10mBJElDjU7VyOFx3_RZ-LcBu_jiZneXhUn-hpSj-S3H_BWBGh9XFc2fntvbMW11-k0XK3f9dMmBD4DLriSDEsdvdqCxdduTx1Ntf_Rg-yToH0016PY" alt="Gauri Cow Target" class="absolute inset-0 w-full h-full object-cover opacity-75">
    <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80"></div>

    <!-- RFID / Barcode Target Reticle -->
    <div class="relative w-60 h-60 border-2 border-dashed border-emerald-400 rounded-2xl flex flex-col items-center justify-between p-3 z-10 animate-pulse">
      <div class="w-full flex justify-between">
        <span class="w-5 h-5 border-t-4 border-l-4 border-emerald-400 -mt-1 -ml-1"></span>
        <span class="w-5 h-5 border-t-4 border-r-4 border-emerald-400 -mt-1 -mr-1"></span>
      </div>

      <!-- Verified Overlay Tag Badge -->
      <div class="bg-brand-800/90 backdrop-blur-md px-4 py-2 rounded-full border border-emerald-400 flex items-center gap-2 shadow-lg">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span class="text-xs font-extrabold tracking-wide text-white">COW-024 DETECTED</span>
      </div>

      <div class="w-full flex justify-between">
        <span class="w-5 h-5 border-b-4 border-l-4 border-emerald-400 -mb-1 -ml-1"></span>
        <span class="w-5 h-5 border-b-4 border-r-4 border-emerald-400 -mb-1 -mr-1"></span>
      </div>
    </div>

    <!-- Quick Status Toast at bottom of scanner -->
    <div class="absolute bottom-4 left-4 right-4 bg-black/70 backdrop-blur-md rounded-2xl p-3 border border-white/15 flex items-center gap-3 z-20">
      <div class="w-10 h-10 rounded-xl bg-emerald-500 text-[#0c2316] flex items-center justify-center font-bold">
        <span class="material-symbols-outlined text-2xl">verified</span>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <h4 class="text-base font-extrabold text-white truncate">Gauri</h4>
          <span class="text-[11px] font-bold bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded border border-emerald-400/30">Gir Breed</span>
        </div>
        <div class="text-xs text-gray-300 font-medium">Tag: COW-024 • Shree Krishna Dairy</div>
      </div>
    </div>
  </div>

  <!-- Bottom Assigned Sensor & Action -->
  <div class="w-full space-y-3 z-20 pt-2">
    <!-- Auto-Assigned Sensor Node (Section 8 of PDF) -->
    <div class="bg-white/10 backdrop-blur-md rounded-2xl p-3.5 border border-white/15 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center text-emerald-300">
          <span class="material-symbols-outlined text-xl">sensors</span>
        </div>
        <div>
          <div class="text-xs font-bold text-white flex items-center gap-1.5">
            <span>Sensor Node #04 Assigned</span>
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          </div>
          <div class="text-[11px] text-emerald-200/70">Auto-pairs with teat cup unit</div>
        </div>
      </div>
      <button class="text-xs font-bold text-emerald-300 px-2.5 py-1 bg-white/10 rounded-lg hover:bg-white/20">
        Switch
      </button>
    </div>

    <!-- Primary Action: Start Milking Session -->
    <button class="w-full py-4 px-4 bg-emerald-500 hover:bg-emerald-400 active:scale-[0.99] text-[#081e12] font-extrabold text-base rounded-2xl shadow-xl shadow-emerald-950/60 flex items-center justify-center gap-2.5 transition-all">
      <span class="material-symbols-outlined text-2xl">play_circle</span>
      <span>Confirm & Start Milking Session</span>
    </button>
    
    <p class="text-center text-[11px] text-emerald-200/60 font-medium">
      Once started, you can pocket the phone while milking is recorded
    </p>
  </div>

</body>
</html>
